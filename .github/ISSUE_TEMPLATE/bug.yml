name: Bug report
description: Report a reproducible defect in contracts, probes, CLI, or Studio.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core contract engine
        - Probe runner
        - CLI and reports
        - Contract Studio
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Do not paste secrets, internal hostnames, or production evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected security or verification behavior
    validations:
      required: true
